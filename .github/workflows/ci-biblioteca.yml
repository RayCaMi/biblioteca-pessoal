name: CI-CD Biblioteca Pessoal

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build and test with Maven
        run: mvn -B verify --file pom.xml

  # ----------------------------------------------------
  # NOVO JOB ADICIONADO ABAIXO
  # ----------------------------------------------------
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    # "needs: build" garante que este job só rode após o job 'build' ter sucesso
    needs: build
    # "permissions" concede a permissão necessária para fazer push para o GHCR
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Action para fazer login seguro no GitHub Container Registry
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          # GITHUB_TOKEN é um segredo gerado automaticamente pelo GitHub Actions
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Action que constrói a imagem a partir do Dockerfile e a envia para o GHCR
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # A tag da imagem será no formato: ghcr.io/SEU_USUARIO/SEU_REPOSITORIO:latest
          tags: ghcr.io/${{ github.repository.toLowerCase() }}:latest